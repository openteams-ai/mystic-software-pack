# Default values for custody-demo
# This is a YAML-formatted file.
#
# Multi-service chart: three deployments + three services.
# Only custody-agent gets a NebariApp — it also serves the React demo UI
# same-origin (the legacy custody-demo-ui Panel service was retired);
# custody-tools and custody-fault-proxy are cluster-internal.
#
# NOTE: This chart adapts the single-app NebariApp template pattern to a
# multi-service chart: the NebariApp sub-block lives at nebariapp.agent.*.
# See charts/custody-demo/README.md for the rationale.

# =============================================================================
# Nebari Integration
# =============================================================================
nebariapp:
  enabled: false
  # hostname is required when enabled=true. The agent serves the React UI
  # same-origin, so this one route covers both API and UI.
  agent:
    # hostname: agent.mystic.openteams.ai
    service:
      name: custody-agent
      port: 8080
    auth:
      enabled: true
      provider: keycloak
      provisionClient: true
      # Public PKCE client for the React SPA (keycloak-js). The operator
      # provisions a second, public Keycloak client (default name
      # <namespace>-custody-agent-spa) with redirect URIs https://<hostname>/*
      # and S256 enforced — same pattern as nebari-chat's frontend-spa client.
      # The confidential client above stays gateway-only.
      spaClient:
        enabled: true
      scopes:
        - openid
        - profile
        - email
    # publicRoutes: paths that bypass Keycloak (healthz stays open for checkmaite probes)
    # No explicit routes list needed — omitting routes means all hostname traffic routes
    # to the service.  Covered paths include:
    #   /v1/custody/runs/*/events  — SSE/WebSocket run-event stream (live UI)
    #   /live                      — live-view landing page
    #   /static-live/*             — live-view static assets
    #   /runs/*                    — per-run artifact viewer
    # WebSocket upgrade passthrough: Envoy Gateway HTTPRoutes carry the Connection
    # and Upgrade headers through by default (Gateway API HTTPRoute spec §7.3 does
    # not strip hop-by-hop headers at the route level; Envoy Gateway's xDS
    # translation preserves them).  The NebariApp CRD has no websocket/upgrade
    # field — passthrough is implicit.  No extra chart config required.
    routing:
      publicRoutes:
        - pathPrefix: /healthz
          pathType: Exact
        # The landing-page tile icon must be fetchable WITHOUT auth (the
        # cluster landing page renders it pre-login). Served from the SPA's
        # public assets baked into the custody-agent image.
        - pathPrefix: /mystic_depot_icon.svg
          pathType: Exact
    gateway: public
    # Cluster landing-page tile (rendered by nebari-landingpage via the
    # NebariApp CRD). icon defaults to the agent-served SVG at
    # https://<hostname>/mystic_depot_icon.svg when left empty.
    landingPage:
      enabled: true
      displayName: "Mystic Depot"
      description: "GEOINT custody demo — agent, live mission UI, run artifacts"
      icon: ""
      category: "Mystic"
      priority: 10

# =============================================================================
# Keycloak / OIDC runtime config (consumed by the custody-agent service)
# =============================================================================
# The agent serves /config.json to the React SPA from CUSTODY_OIDC_* env vars
# (agent_service/app.py) and validates API bearer tokens against the realm
# JWKS (agent_service/auth.py). The deployment template derives those env vars
# from this block when nebariapp auth is enabled.
keycloak:
  # External URL — used by the browser (keycloak-js) and as the expected
  # token issuer (`iss` claim).
  url: https://keycloak.mystic.openteams.ai
  realm: nebari
  # In-cluster URL for JWKS fetches, so token validation does not hairpin
  # through the external NLB (mirrors the operator's SecurityPolicy, which
  # uses the internal endpoint for the token URL).
  internalUrl: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080
  # SPA client id override; empty = the operator's default naming for
  # auth.spaClient, <namespace>-custody-agent-spa.
  spaClientId: ""

# =============================================================================
# Secrets (referenced by name — never inline values)
# =============================================================================
# Required K8s Secrets that must exist in the release namespace before deploy:
#   model-api-keys  — keys: ANTHROPIC_API_KEY, OPENAI_API_KEY
#   langfuse-keys   — keys: LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
secrets:
  modelApiKeys: model-api-keys
  langfuseKeys: langfuse-keys

# =============================================================================
# Service Account (IRSA for S3 access)
# =============================================================================
serviceAccount:
  name: custody-data
  # irsaRoleArn: arn:aws:iam::<account>:role/custody-demo-data-irsa
  irsaRoleArn: ""

# =============================================================================
# Common env wiring
# =============================================================================
common:
  otelExporterOtlpEndpoint: http://opentelemetry-collector.monitoring.svc:4318
  dataBucket: custody-demo-data

# =============================================================================
# Run-artifacts volume (custody-agent)
# =============================================================================
# The agent writes run artifacts (event logs, evidence bundles) to
# CUSTODY_RUN_ARTIFACTS (/data/artifacts).  By default an emptyDir is used
# (ephemeral, survives pod restarts within the same node).  For durable storage
# supply a PVC name:
#
#   artifacts:
#     persistentVolumeClaim:
#       claimName: custody-artifacts-pvc
#
# The chart mounts this volume into custody-agent only (other services do not
# write artifacts).
artifacts:
  persistentVolumeClaim:
    # When create=true the chart provisions the PVC defined below. Otherwise set
    # claimName to a pre-existing PVC. Leave claimName empty for an ephemeral
    # emptyDir (default). A PVC is REQUIRED for run/project durability (issue #19:
    # the SQLite store lives at /data/artifacts/custody.db inside this volume).
    create: false
    claimName: ""
    storageClass: ""   # "" = cluster default (longhorn). Must be ReadWriteOnce-capable.
    size: 5Gi

# =============================================================================
# Litestream — stream the run-store SQLite db to S3 (durable source of truth)
# =============================================================================
# When enabled, a restore init-container pulls custody.db from S3 on startup and
# a sidecar continuously replicates its WAL back. With S3 as the durable store,
# /data/artifacts can be a plain emptyDir (set artifacts.persistentVolumeClaim
# off) — no PVC, no Recreate/Multi-Attach. Litestream uses the pod's IRSA creds;
# the role needs write on s3://<bucket>/<path-prefix> (run-store/*).
litestream:
  enabled: false
  image: litestream/litestream:0.3.13
  dbPath: /data/artifacts/custody.db
  s3:
    bucket: custody-demo-data
    path: run-store/custody.db
    region: us-west-2

# =============================================================================
# GPU scheduling (for custody-tools when gpu=true)
# =============================================================================
gpu:
  # gpu-small node group (g4dn.xlarge, T4 16 GB, scale-to-zero)
  nodeSelector:
    eks.amazonaws.com/nodegroup: gpu-small
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

# =============================================================================
# Per-service configuration
# =============================================================================
# Each entry under services: becomes one Deployment + one Service.
# Keys must match the contract service names from shared-contracts §9.
# Swap image/tag/args to move from stub to real image; set gpu: true on
# custody-tools when Team 2's YOLO/ByteTrack image lands.
services:
  custody-agent:
    port: 8080
    image:
      repository: hashicorp/http-echo
      tag: "1.0.0"
    args:
      - "-listen=:8080"
      - '-text={"status":"ok","service":"custody-agent-stub"}'
    gpu: false
    envFromSecrets:
      - model-api-keys
      - langfuse-keys
    env:
      - name: LANGFUSE_HOST
        # Cluster-provided Langfuse (GitOps repo, namespace "langfuse")
        value: http://langfuse-web.langfuse.svc:3000
      - name: TOOLS_BASE_URL
        # agent ALWAYS calls the fault proxy — contract §4
        value: http://custody-fault-proxy.nebari-custody-demo-pack.svc:8085
      - name: CUSTODY_RUN_ARTIFACTS
        value: /data/artifacts
      - name: CUSTODY_PROJECTS_DB
        # Default is a SIBLING of CUSTODY_RUN_ARTIFACTS (/data/custody-projects.json),
        # which is root-owned image fs in the non-root container - project
        # creates 500 on the persist write (and silently survive only
        # in-memory). Keep the store inside the writable artifacts volume so
        # it also persists when artifacts move to a PVC. Retained as the legacy
        # JSON path imported once into SQLite on first boot.
        value: /data/artifacts/custody-projects.json
      - name: CUSTODY_DB
        # SQLite run + project store (issue #19). Lives inside the artifacts
        # volume (/data/artifacts); persisted to S3 via the litestream sidecar.
        value: /data/artifacts/custody.db
      - name: CUSTODY_AUTH_DISABLED
        # The Envoy gateway SecurityPolicy already enforces OIDC for external
        # traffic to agent.mystic.openteams.ai. Disable the redundant app-level
        # auth so internal callers (checkmaite-api, eval CLI) can reach the
        # agent without a token. External access stays gateway-protected.
        value: "1"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi

  custody-tools:
    port: 8090
    image:
      repository: hashicorp/http-echo
      tag: "1.0.0"
    args:
      - "-listen=:8090"
      - '-text={"status":"ok","service":"custody-tools-stub"}'
    gpu: false  # flip to true when Team 2's real YOLO/ByteTrack image lands
    envFromSecrets: []
    env:
      - name: CUSTODY_DATA_BUCKET
        value: custody-demo-data
    # CPU YOLO/ByteTrack over 4K SeaDronesSee frames is memory-heavy: at an 8Gi
    # limit the pod was OOMKilled (exit 137) under a few concurrent eval runs,
    # which surfaced to the agent as 502/504 tool failures and timed runs out.
    # 16Gi gives burst headroom on the 31Gi nodes; the 2Gi request keeps it off
    # the small (7.9Gi) nodes so the limit is actually usable.
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "3"
        memory: 16Gi

  custody-fault-proxy:
    port: 8085
    image:
      repository: hashicorp/http-echo
      tag: "1.0.0"
    args:
      - "-listen=:8085"
      - '-text={"status":"ok","service":"custody-fault-proxy-stub"}'
    gpu: false
    envFromSecrets: []
    env:
      - name: UPSTREAM_BASE_URL
        value: http://custody-tools.nebari-custody-demo-pack.svc:8090
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
