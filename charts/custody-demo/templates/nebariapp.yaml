{{/*
  NebariApp Custom Resource — custody-agent
  ------------------------------------------
  One NebariApp routes the agent, which also serves the React demo UI
  same-origin (the legacy custody-demo-ui Panel service was retired).
  custody-tools and custody-fault-proxy are cluster-internal and
  intentionally have no NebariApp.

  See README.md §Multi-service NebariApp adaptation for the design note.

  apiVersion / kind follow the template canonical form:
    reconcilers.nebari.dev/v1 / NebariApp
  (NOT the older nebari.dev/v1alpha1 / NebariApplication from ADR-0003-era plans)
*/}}
{{- if .Values.nebariapp.enabled }}
---
apiVersion: reconcilers.nebari.dev/v1
kind: NebariApp
metadata:
  name: custody-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "custody-demo.labels" . | nindent 4 }}
spec:
  hostname: {{ required "nebariapp.agent.hostname is required when nebariapp.enabled is true" .Values.nebariapp.agent.hostname }}
  service:
    name: {{ .Values.nebariapp.agent.service.name | default "custody-agent" }}
    port: {{ .Values.nebariapp.agent.service.port | default 8080 }}
  {{- with .Values.nebariapp.agent.routing }}
  routing:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nebariapp.agent.auth }}
  auth:
    enabled: {{ .enabled | default false }}
    provider: {{ .provider | default "keycloak" }}
    provisionClient: {{ .provisionClient | default true }}
    {{- with .redirectURI }}
    redirectURI: {{ . }}
    {{- end }}
    {{- with .scopes }}
    scopes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .groups }}
    groups:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .Values.nebariapp.agent.gateway }}
  gateway: {{ . }}
  {{- end }}
  {{- with .Values.nebariapp.agent.landingPage }}
  {{- if .enabled }}
  landingPage:
    enabled: true
    displayName: {{ .displayName | quote }}
    description: {{ .description | quote }}
    # icon must be anonymously fetchable — /mystic_depot_icon.svg is a
    # publicRoute served by the agent image itself
    icon: {{ .icon | default (printf "https://%s/mystic_depot_icon.svg" $.Values.nebariapp.agent.hostname) | quote }}
    {{- with .category }}
    category: {{ . | quote }}
    {{- end }}
    {{- with .priority }}
    priority: {{ . }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
