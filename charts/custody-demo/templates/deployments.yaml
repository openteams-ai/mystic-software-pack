{{/*
  One Deployment per service entry in .Values.services.
  GPU scheduling (nodeSelector + tolerations) applied when svc.gpu=true.
  Image swap is values-only: set services.<name>.image.repository + tag + args.

  custody-agent gets a run-artifacts volume mounted at /data/artifacts.
  Default is emptyDir; supply .Values.artifacts.persistentVolumeClaim.claimName
  for a durable PVC.
*/}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: custody-demo
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: {{ include "custody-demo.chart" $ }}
spec:
  {{- if or (and (eq $name "custody-agent") $.Values.artifacts $.Values.artifacts.persistentVolumeClaim $.Values.artifacts.persistentVolumeClaim.claimName) $svc.gpu }}
  # A ReadWriteOnce PVC and a single-GPU service both need the old pod to
  # terminate before the replacement pod can schedule.
  strategy:
    type: Recreate
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: custody-demo
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- if eq $name "custody-agent" }}
      securityContext:
        # The agent runs as non-root uid 10001 (USER custody). fsGroup makes the
        # mounted /data/artifacts volume group-owned and group-writable, so the
        # SQLite store (custody.db) and run artifacts can be written. A longhorn
        # RWO PVC otherwise mounts root-owned and the agent crashes on startup
        # opening the db (the image-build chown is shadowed by the mount).
        fsGroup: 10001
      {{- end }}
      {{- if $svc.gpu }}
      nodeSelector:
        {{- range $key, $value := $.Values.gpu.nodeSelector }}
        {{- if $value }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      tolerations:
        {{- toYaml $.Values.gpu.tolerations | nindent 8 }}
      {{- end }}
      {{- if eq $name "custody-agent" }}
      volumes:
        - name: run-artifacts
          {{- if and $.Values.artifacts $.Values.artifacts.persistentVolumeClaim $.Values.artifacts.persistentVolumeClaim.claimName }}
          persistentVolumeClaim:
            claimName: {{ $.Values.artifacts.persistentVolumeClaim.claimName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Writable S3 video cache (CUSTODY_VIDEO_CACHE default /data/video-cache).
        # Without it the non-root container cannot mkdir under the image's
        # root-owned /data and every video fetch 503s with EACCES.
        - name: video-cache
          emptyDir: {}
        {{- if (($.Values.litestream).enabled) }}
        - name: litestream-config
          configMap:
            name: custody-litestream
        {{- end }}
      {{- if (($.Values.litestream).enabled) }}
      initContainers:
        # Restore custody.db from S3 before the agent starts. No-op on first run
        # (-if-replica-exists). Makes S3 the durable source of truth so the db
        # survives pod rolls AND PVC/cluster loss — emptyDir is fine below.
        - name: litestream-restore
          image: {{ $.Values.litestream.image }}
          args:
            - restore
            - -if-replica-exists
            - -config
            - /etc/litestream/litestream.yml
            - {{ $.Values.litestream.dbPath | quote }}
          volumeMounts:
            - name: run-artifacts
              mountPath: /data/artifacts
            - name: litestream-config
              mountPath: /etc/litestream
      {{- end }}
      {{- end }}
      {{- if hasPrefix "custody-tools" $name }}
      volumes:
        # Same writable video cache as the agent (tools_service/video.py
        # downloads and decodes mission clips from S3).
        - name: video-cache
          emptyDir: {}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.common.otelExporterOtlpEndpoint }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}
            {{- if and (eq $name "custody-agent") $.Values.nebariapp.enabled ((($.Values.nebariapp.agent).auth).enabled) }}
            {{- $kc := $.Values.keycloak }}
            {{- /* Served to the SPA via /config.json (agent_service/app.py) */}}
            - name: CUSTODY_OIDC_FRONTEND_URL
              value: {{ $kc.url | quote }}
            - name: CUSTODY_OIDC_REALM
              value: {{ $kc.realm | quote }}
            - name: CUSTODY_OIDC_CLIENT_ID
              value: {{ $kc.spaClientId | default (printf "%s-custody-agent-spa" $.Release.Namespace) | quote }}
            {{- /* Bearer-token validation for /v1/custody (agent_service/auth.py) */}}
            - name: CUSTODY_OIDC_ISSUER
              value: {{ printf "%s/realms/%s" $kc.url $kc.realm | quote }}
            - name: CUSTODY_OIDC_JWKS_URL
              value: {{ printf "%s/realms/%s/protocol/openid-connect/certs" $kc.internalUrl $kc.realm | quote }}
            - name: CUSTODY_UI_TITLE
              value: {{ ((($.Values.nebariapp.agent).landingPage).displayName) | default "Mystic Depot" | quote }}
            {{- end }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $svc.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if eq $name "custody-agent" }}
          volumeMounts:
            - name: run-artifacts
              mountPath: /data/artifacts
            - name: video-cache
              mountPath: /data/video-cache
          {{- end }}
          {{- if hasPrefix "custody-tools" $name }}
          volumeMounts:
            - name: video-cache
              mountPath: /data/video-cache
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if $svc.gpu }}
          resources:
            requests:
              {{- toYaml $svc.resources.requests | nindent 14 }}
              nvidia.com/gpu: 1
            limits:
              {{- toYaml $svc.resources.limits | nindent 14 }}
              nvidia.com/gpu: 1
          {{- else }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
        {{- if and (eq $name "custody-agent") (($.Values.litestream).enabled) }}
        # Sidecar: continuously replicate custody.db's WAL to S3 (sub-second).
        # Uses the pod's IRSA creds (EKS injects them into every container).
        - name: litestream
          image: {{ $.Values.litestream.image }}
          args:
            - replicate
            - -config
            - /etc/litestream/litestream.yml
          volumeMounts:
            - name: run-artifacts
              mountPath: /data/artifacts
            - name: litestream-config
              mountPath: /etc/litestream
        {{- end }}
{{- end }}
