apiVersion: v1
kind: Service
metadata:
  # Contract §9: http://judge.nebari-judge-pack.svc:8000
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "judge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "judge.selectorLabels" . | nindent 4 }}
