apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "judge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # single GPU node — never two pods simultaneously
  selector:
    matchLabels:
      {{- include "judge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "judge.selectorLabels" . | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --model
            - {{ include "judge.modelName" . }}
            - --served-model-name
            - {{ .Values.model.servedModelName }}
            - --port
            - "{{ .Values.service.port }}"
            - --max-model-len
            - "{{ .Values.model.maxModelLen }}"
            - --gpu-memory-utilization
            - "{{ .Values.model.gpuMemoryUtilization }}"
          env:
            - name: HF_HOME
              value: /cache
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 80   # first start downloads ~16 GB of weights
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: judge-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
