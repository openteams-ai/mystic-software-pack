# Default values for judge
# This is a YAML-formatted file.
#
# The judge is intentionally cluster-internal (no NebariApp).
# Contract endpoint: http://judge.nebari-judge-pack.svc:8000/v1
# Served model name: "judge" (contract §7)

# =============================================================================
# Nebari Integration
# =============================================================================
# The judge service has no external routing — it is accessed only by the
# checkmaite plugin from within the cluster (contract §7).  This nebariapp
# block exists only so helm lint passes the same template as other charts.
nebariapp:
  enabled: false
  # No hostname — judge is cluster-internal by design.
  service:
    name: judge
    port: 8000
  auth:
    enabled: false
    provider: keycloak
    provisionClient: false
    scopes:
      - openid
      - profile
      - email
  gateway: public

# =============================================================================
# Application image
# =============================================================================
image:
  repository: vllm/vllm-openai
  tag: "v0.8.5"
  pullPolicy: IfNotPresent

# =============================================================================
# Model configuration
# =============================================================================
model:
  # primary model — Qwen2.5-VL-7B-Instruct
  primary: Qwen/Qwen2.5-VL-7B-Instruct
  # fallback — flip useFallback: true if 7B OOMs on the GPU node
  fallback: Qwen/Qwen2.5-VL-3B-Instruct
  useFallback: false
  # Contract §7: served model name must be "judge"
  servedModelName: judge
  maxModelLen: 16384
  gpuMemoryUtilization: "0.90"

# =============================================================================
# Service (contract §9: http://judge.nebari-judge-pack.svc:8000)
# =============================================================================
service:
  name: judge
  port: 8000

# =============================================================================
# Weight cache PVC (EFS, RWX — weights download once, survive pod reschedule)
# =============================================================================
cache:
  storageClassName: efs-sc
  size: 100Gi

# =============================================================================
# GPU scheduling
# =============================================================================
nodeSelector:
  nodegroup: gpu

tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: "3"
    memory: 10Gi
    nvidia.com/gpu: 1
  limits:
    memory: 13Gi
    nvidia.com/gpu: 1

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
