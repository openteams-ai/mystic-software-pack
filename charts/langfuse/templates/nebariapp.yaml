{{/*
  NebariApp Custom Resource — Langfuse web UI
  -------------------------------------------
  This is the only template in this chart; all Deployments and Services come
  from the upstream langfuse subchart.  The NebariApp points to the upstream
  service (langfuse-web) and configures routing + Keycloak SSO.

  /api/public/* is a publicRoute so SDK ingestion, OTLP ingest, and the score
  API all pass through with Langfuse's own key-based auth (contract §6).

  Contract-mandated in-cluster URL (used by agent + OTel collector):
    http://langfuse-web.nebari-langfuse-pack.svc:3000

  apiVersion / kind: reconcilers.nebari.dev/v1 / NebariApp
  (canonical template form — NOT the older nebari.dev/v1alpha1 / NebariApplication)
*/}}
{{- if .Values.nebariapp.enabled }}
apiVersion: reconcilers.nebari.dev/v1
kind: NebariApp
metadata:
  name: {{ include "langfuse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
spec:
  hostname: {{ required "nebariapp.hostname is required when nebariapp.enabled is true" .Values.nebariapp.hostname }}
  service:
    # Points to the upstream langfuse-web service: <release>-langfuse-web
    name: {{ .Values.nebariapp.service.name | default (include "langfuse.webServiceName" .) }}
    port: {{ .Values.nebariapp.service.port | default 3000 }}
  {{- with .Values.nebariapp.routing }}
  routing:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nebariapp.auth }}
  auth:
    enabled: {{ .enabled | default false }}
    provider: {{ .provider | default "keycloak" }}
    provisionClient: {{ .provisionClient | default true }}
    {{- with .redirectURI }}
    redirectURI: {{ . }}
    {{- end }}
    {{- with .scopes }}
    scopes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .groups }}
    groups:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .Values.nebariapp.gateway }}
  gateway: {{ . }}
  {{- end }}
{{- end }}
