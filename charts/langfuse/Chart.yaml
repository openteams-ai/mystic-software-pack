apiVersion: v2
name: langfuse
description: >
  Nebari software pack wrapping the official Langfuse v3 Helm chart.
  Provides LLM observability for the custody-eval harness (traces, scores,
  OTLP ingest).  NebariApp routes the Langfuse web UI with Keycloak SSO;
  /api/public/* is exempted from OIDC so SDK ingestion and OTLP ingest use
  Langfuse's own key-based auth (contract §6).
  Namespace: nebari-langfuse-pack.
type: application
version: 0.1.0
appVersion: "3"
dependencies:
  - name: langfuse
    version: "1.5.34"
    repository: https://langfuse.github.io/langfuse-k8s
