# Default values for langfuse (wrap-existing-chart style)
# This is a YAML-formatted file.
#
# This chart wraps the upstream langfuse/langfuse chart and adds a NebariApp
# for routing + Keycloak SSO.  The upstream chart handles all Deployments and
# Services; this chart only adds nebariapp.yaml.

# =============================================================================
# Nebari Integration
# =============================================================================
# Creates a NebariApp CRD for the Langfuse web UI.
# /api/public/* is a publicRoute so SDK ingestion, OTLP, and score API calls
# pass through with Langfuse's own key-based auth (contract §6).
#
# NOTE on Keycloak-exemption gap:
# The NebariApp CRD supports routing.publicRoutes (see nebariapp-crd-reference.md
# §spec.routing — publicRoutes are paths that bypass OIDC enforcement).  We use
# publicRoutes: [{pathPrefix: /api/public, pathType: PathPrefix}] to keep the
# Langfuse SDK/OTLP ingest reachable without SSO.
# If the operator version in use does not support publicRoutes, set
# nebariapp.auth.enabled=false and enforce access control via Langfuse's own
# LANGFUSE_INIT_* key mechanism.  See charts/langfuse/README.md §Auth gap.
nebariapp:
  enabled: false
  # hostname: langfuse.custody.demo.openteams.com  # Required when enabled
  service:
    # Upstream chart creates a service named <release>-langfuse-web (langfuse chart v1.5.x)
    # Override with the actual release-qualified name at deploy time if needed.
    name: ""   # Defaults to <release>-langfuse-web (see templates/nebariapp.yaml)
    port: 3000
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    scopes:
      - openid
      - profile
      - email
  # publicRoutes: /api/public/* bypasses Keycloak — SDK ingestion uses Langfuse key auth (§6)
  routing:
    publicRoutes:
      - pathPrefix: /api/public
        pathType: PathPrefix
  gateway: public

# =============================================================================
# Langfuse upstream chart overrides
# =============================================================================
# All values under this key are passed to the langfuse subchart.
# See https://langfuse.github.io/langfuse-k8s for full reference.
#
# Secret references for core credentials — never inline values here.
# Required K8s Secrets that must exist in the release namespace before deploy:
#   langfuse-core  — keys: salt, encryption-key, nextauth-secret
#   langfuse-init  — keys: LANGFUSE_INIT_ORG_ID, LANGFUSE_INIT_ORG_NAME,
#                          LANGFUSE_INIT_PROJECT_ID, LANGFUSE_INIT_PROJECT_NAME,
#                          LANGFUSE_INIT_PROJECT_PUBLIC_KEY, LANGFUSE_INIT_PROJECT_SECRET_KEY,
#                          LANGFUSE_INIT_USER_EMAIL, LANGFUSE_INIT_USER_NAME,
#                          LANGFUSE_INIT_USER_PASSWORD
langfuse:
  langfuse:
    salt:
      secretKeyRef:
        name: langfuse-core
        key: salt
    encryptionKey:
      secretKeyRef:
        name: langfuse-core
        key: encryption-key
    nextauth:
      # url: https://<nebariapp.hostname>  # injected per-deployment
      url: ""
      secret:
        secretKeyRef:
          name: langfuse-core
          key: nextauth-secret
    additionalEnv:
      - name: LANGFUSE_INIT_ORG_ID
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_ORG_ID
      - name: LANGFUSE_INIT_ORG_NAME
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_ORG_NAME
      - name: LANGFUSE_INIT_PROJECT_ID
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_PROJECT_ID
      - name: LANGFUSE_INIT_PROJECT_NAME
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_PROJECT_NAME
      - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_PROJECT_SECRET_KEY
      - name: LANGFUSE_INIT_USER_EMAIL
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_USER_EMAIL
      - name: LANGFUSE_INIT_USER_NAME
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_USER_NAME
      - name: LANGFUSE_INIT_USER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: langfuse-init
            key: LANGFUSE_INIT_USER_PASSWORD
  postgresql:
    deploy: true
    auth:
      # password: ""  # Required — inject per-deployment to avoid Bitnami selfHeal regeneration
      password: ""
  clickhouse:
    deploy: true
    auth:
      password: ""   # Required — inject per-deployment
  redis:
    deploy: true
    auth:
      password: ""   # Required — inject per-deployment
  minio:
    deploy: true     # Bundled MinIO for Langfuse media/exports
    auth:
      rootPassword: ""   # Required — inject per-deployment

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
