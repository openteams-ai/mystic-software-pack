{{/*
  Nightly scenario-A smoke eval CronJob.
  Disabled by default (nightlyEval.enabled=false). Enable in ArgoCD values
  (set nightlyEval.enabled=true). Uses the api image, which bundles the eval
  CLI and the baked scenarios/rubrics.

  Init container:
    fetch-gt: sync *.gt.txt from S3 (IRSA ServiceAccount grants access)

  Main container invokes the eval CLI (contract §10) with exact flags.
*/}}
{{- if .Values.nightlyEval.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: checkmaite-nightly-smoke
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkmaite.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.nightlyEval.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: checkmaite-nightly-smoke
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccount.name }}
          # Scenarios + rubrics are baked into the api image (used here), so no
          # fetch-benchmarks clone is needed — only GT must be synced from S3.
          initContainers:
            # GT files are required for the deterministic GT metrics (idf1,
            # custody_*, id_switches, reacquired, ece ...). Syncs only *.gt.txt
            # objects from the staged SeaDronesSee data; IRSA grants read access.
            - name: fetch-gt
              image: amazon/aws-cli:2.17.0
              args:
                - s3
                - sync
                - s3://{{ .Values.s3.bucket }}/seadronessee
                - /data/gt/seadronessee
                - --exclude
                - "*"
                - --include
                - "*.gt.txt"
              volumeMounts:
                - name: gt-data
                  mountPath: /data/gt
          containers:
            - name: smoke-eval
              # The api image now bundles the eval CLI + baked benchmarks
              # (the standalone checkmaite image was retired).
              image: "{{ required "images.api.repository is required when nightlyEval.enabled" .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
              # CLI contract §10 — exact flags required by checkmaite_plugin_custody.cli
              command:
                - python
                - -m
                - checkmaite_plugin_custody.cli
                - run
                - --scenario
                - {{ .Values.nightlyEval.scenario }}
                - --scenarios-dir
                - /benchmarks/scenarios
                - --model
                - {{ .Values.nightlyEval.modelId }}
                - --sut-base-url
                - {{ .Values.endpoints.sutBaseUrl }}
                - --tools-base-url
                - {{ .Values.endpoints.toolsBaseUrl }}
                - --judge-base-url
                - {{ .Values.endpoints.judgeBaseUrl }}
                - --rubrics-dir
                - /benchmarks/rubrics
                - --gt-root
                - /data/gt
                - --out
                - {{ .Values.analytics.mountPath }}
              env:
                - name: LANGFUSE_HOST
                  value: {{ .Values.langfuse.host }}
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.langfuse.secretName }}
                      key: LANGFUSE_PUBLIC_KEY
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.langfuse.secretName }}
                      key: LANGFUSE_SECRET_KEY
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: {{ .Values.endpoints.otelExporterOtlpEndpoint }}
                - name: CUSTODY_DATA_BUCKET
                  value: {{ .Values.s3.bucket }}
                # Belt-and-braces: CLI falls back to these env vars if flags are absent
                - name: SUT_BASE_URL
                  value: {{ .Values.endpoints.sutBaseUrl }}
                - name: TOOLS_BASE_URL
                  value: {{ .Values.endpoints.toolsBaseUrl }}
                - name: JUDGE_BASE_URL
                  value: {{ .Values.endpoints.judgeBaseUrl }}
                - name: JUDGE_MODEL
                  value: {{ .Values.judge.model }}
                - name: JUDGE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.judge.secretName }}
                      key: OPENROUTER_API_KEY
                - name: CUSTODY_GT_ROOT
                  value: /data/gt
              volumeMounts:
                - name: analytics
                  mountPath: {{ .Values.analytics.mountPath }}
                - name: gt-data
                  mountPath: /data/gt
                  readOnly: true
          volumes:
            - name: analytics
              persistentVolumeClaim:
                claimName: checkmaite-analytics
            - name: gt-data
              emptyDir: {}
{{- end }}
