{{/*
  Two deployments replace the old single checkmaite-serve one:

    api — checkmaite-custody-api (FastAPI workflow-builder API, :8000).
          Carries the Langfuse/judge credentials because executed workflow
          blocks (trace_rules, judge_rubric) read them from the environment;
          base URLs come from each block's node config. Workflows persist as
          JSON under CUSTODY_DATA_DIR, pointed at the RWX analytics PVC so
          they survive restarts and write_scores output lands on the same
          volume the nightly CronJob writes to.

    ui  — checkmaite-custody-ui (nginx :3000 serving the SPA bundle).
          nginx proxies /api/ to http://api:8000 (baked into the image), so
          the api Service below must keep that exact name.
*/}}
{{- $scenarioCatalog := .Values.scenarioCatalog | default dict -}}
{{- $gitSync := $scenarioCatalog.gitSync | default dict -}}
{{- $gitSyncEnabled := $gitSync.enabled | default false -}}
{{- $gitSyncAuth := $gitSync.auth | default dict -}}
{{- $gitSyncAuthSecret := $gitSyncAuth.existingSecret | default "" -}}
{{- $benchmarksRoot := $scenarioCatalog.bakedPath | default "/benchmarks" -}}
{{- if $gitSyncEnabled -}}
{{- $benchmarksRoot = printf "%s/%s" ($gitSync.mountPath | default "/benchmarks-git") ($gitSync.link | default "current") -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "checkmaite.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkmaite.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "checkmaite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "checkmaite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Scenarios + rubrics are baked into the api image at /benchmarks
      # (CUSTODY_SCENARIOS_DIR / CUSTODY_RUBRICS_DIR image defaults), so no
      # fetch-benchmarks init container is needed. Storage strategy: plugin #19.
      initContainers:
        {{- if $gitSyncEnabled }}
        - name: sync-benchmarks-once
          image: {{ $gitSync.image | default "registry.k8s.io/git-sync/git-sync:v4.4.0" | quote }}
          env:
            - name: GITSYNC_REPO
              value: {{ required "scenarioCatalog.gitSync.repo is required when gitSync.enabled=true" $gitSync.repo | quote }}
            - name: GITSYNC_REF
              value: {{ $gitSync.ref | default "main" | quote }}
            - name: GITSYNC_ROOT
              value: {{ $gitSync.mountPath | default "/benchmarks-git" | quote }}
            - name: GITSYNC_LINK
              value: {{ $gitSync.link | default "current" | quote }}
            - name: GITSYNC_DEPTH
              value: {{ $gitSync.depth | default 1 | quote }}
            - name: GITSYNC_ONE_TIME
              value: "true"
            {{- if $gitSyncAuthSecret }}
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $gitSyncAuthSecret | quote }}
                  key: {{ $gitSyncAuth.usernameKey | default "username" | quote }}
            - name: GITSYNC_PASSWORD_FILE
              value: /etc/git-secret/token
            {{- end }}
          volumeMounts:
            - name: benchmarks-git
              mountPath: {{ $gitSync.mountPath | default "/benchmarks-git" }}
            {{- if $gitSyncAuthSecret }}
            - name: benchmarks-git-credentials
              mountPath: /etc/git-secret
              readOnly: true
            {{- end }}
        {{- end }}
        # GT files are required for deterministic GT-backed scoring in live UI
        # runs. Keep this in sync with the nightly smoke eval's GT bootstrap.
        - name: fetch-gt
          image: amazon/aws-cli:2.17.0
          args:
            - s3
            - sync
            - s3://{{ .Values.s3.bucket }}/seadronessee
            - /data/gt/seadronessee
            - --exclude
            - "*"
            - --include
            - "*.gt.txt"
          volumeMounts:
            - name: gt-data
              mountPath: /data/gt
      containers:
        - name: api
          image: "{{ required "images.api.repository is required" .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CUSTODY_DATA_DIR
              value: {{ .Values.analytics.mountPath }}
            - name: CUSTODY_EVAL_DB
              value: {{ printf "%s/eval.db" .Values.analytics.mountPath | quote }}
            - name: CUSTODY_RUN_EVENTS_DB
              value: {{ printf "%s/run_events.db" .Values.analytics.mountPath | quote }}
            - name: CUSTODY_WORKER_JOBS_ENABLED
              value: {{ .Values.workerJobs.enabled | default false | quote }}
            - name: CUSTODY_WORKER_IMAGE
              value: "{{ required "images.api.repository is required" .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
            - name: CUSTODY_WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.images.api.pullPolicy | quote }}
            - name: CUSTODY_WORKER_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.name | quote }}
            - name: CUSTODY_WORKER_JOB_TTL_SECONDS
              value: {{ .Values.workerJobs.ttlSecondsAfterFinished | default 86400 | quote }}
            - name: CUSTODY_WORKER_BACKOFF_LIMIT
              value: {{ .Values.workerJobs.backoffLimit | default 0 | quote }}
            - name: CUSTODY_WORKER_MAX_CONCURRENT_JOBS
              value: {{ .Values.workerJobs.maxConcurrentJobs | default 0 | quote }}
            {{- with .Values.workerJobs.resources.requests }}
            {{- with .cpu }}
            - name: CUSTODY_WORKER_CPU_REQUEST
              value: {{ . | quote }}
            {{- end }}
            {{- with .memory }}
            - name: CUSTODY_WORKER_MEMORY_REQUEST
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.workerJobs.resources.limits }}
            {{- with .cpu }}
            - name: CUSTODY_WORKER_CPU_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .memory }}
            - name: CUSTODY_WORKER_MEMORY_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: CUSTODY_ANALYTICS_CLAIM
              value: checkmaite-analytics
            - name: CUSTODY_LANGFUSE_SECRET_NAME
              value: {{ .Values.langfuse.secretName | quote }}
            - name: CUSTODY_JUDGE_SECRET_NAME
              value: {{ .Values.judge.secretName | quote }}
            {{- if and .Values.nebariapp.enabled ((.Values.nebariapp.auth).enabled) }}
            {{- $kc := .Values.keycloak }}
            {{- /* Served to the SPA via /config.json (api /api/v1/config.json) */}}
            - name: CUSTODY_OIDC_FRONTEND_URL
              value: {{ $kc.url | quote }}
            - name: CUSTODY_OIDC_REALM
              value: {{ $kc.realm | quote }}
            - name: CUSTODY_OIDC_CLIENT_ID
              value: {{ $kc.spaClientId | default (printf "%s-%s-spa" .Release.Namespace (include "checkmaite.fullname" .)) | quote }}
            {{- /* Bearer-token validation against the realm JWKS */}}
            - name: CUSTODY_OIDC_ISSUER
              value: {{ printf "%s/realms/%s" $kc.url $kc.realm | quote }}
            - name: CUSTODY_OIDC_JWKS_URL
              value: {{ printf "%s/realms/%s/protocol/openid-connect/certs" $kc.internalUrl $kc.realm | quote }}
            {{- end }}
            - name: LANGFUSE_HOST
              value: {{ .Values.langfuse.host }}
            - name: LANGFUSE_PUBLIC_URL
              value: {{ .Values.langfuse.publicUrl | default "https://langfuse.mystic.openteams.ai" | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: LANGFUSE_SECRET_KEY
            - name: JUDGE_BASE_URL
              value: {{ .Values.endpoints.judgeBaseUrl }}
            - name: JUDGE_MODEL
              value: {{ .Values.judge.model }}
            - name: JUDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.judge.secretName }}
                  key: OPENROUTER_API_KEY
            # Ask-Langfuse chat agent: model via OpenRouter (key reused from
            # judge-keys as CUSTODY_CHAT_API_KEY); base URL overridable via
            # chat.baseUrl, defaulting to the judge's OpenRouter endpoint. The
            # LANGFUSE_* vars above let it reach Langfuse's MCP server.
            - name: CUSTODY_CHAT_ENABLED
              value: {{ .Values.chat.enabled | quote }}
            - name: CUSTODY_CHAT_MODEL
              value: {{ .Values.chat.model | quote }}
            - name: CUSTODY_CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.judge.secretName }}
                  key: OPENROUTER_API_KEY
            - name: CUSTODY_CHAT_BASE_URL
              value: {{ .Values.chat.baseUrl | default .Values.endpoints.judgeBaseUrl | quote }}
            - name: SUT_BASE_URL
              value: {{ .Values.endpoints.sutBaseUrl }}
            - name: TOOLS_BASE_URL
              value: {{ .Values.endpoints.toolsBaseUrl }}
            # Scenario catalog dir for GET /api/v1/scenarios + POST /api/v1/runs
            # — baked into the api image by default, or backed by git-sync when
            # scenarioCatalog.gitSync.enabled=true.
            - name: CUSTODY_SCENARIOS_DIR
              value: {{ printf "%s/scenarios" $benchmarksRoot | quote }}
            - name: CUSTODY_RUBRICS_DIR
              value: {{ printf "%s/rubrics" $benchmarksRoot | quote }}
            - name: CUSTODY_BENCHMARKS_DIR
              value: {{ $benchmarksRoot | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_SYNC_ENABLED
              value: {{ $gitSyncEnabled | quote }}
            {{- if $gitSyncEnabled }}
            - name: CUSTODY_BENCHMARKS_REPO
              value: {{ $gitSync.repo | quote }}
            - name: CUSTODY_BENCHMARKS_REF
              value: {{ $gitSync.ref | default "main" | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_SYNC_IMAGE
              value: {{ $gitSync.image | default "registry.k8s.io/git-sync/git-sync:v4.4.0" | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_ROOT
              value: {{ $gitSync.mountPath | default "/benchmarks-git" | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_LINK
              value: {{ $gitSync.link | default "current" | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_DEPTH
              value: {{ $gitSync.depth | default 1 | quote }}
            {{- if $gitSyncAuthSecret }}
            - name: CUSTODY_BENCHMARKS_GIT_AUTH_SECRET
              value: {{ $gitSyncAuthSecret | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_USERNAME_KEY
              value: {{ $gitSyncAuth.usernameKey | default "username" | quote }}
            - name: CUSTODY_BENCHMARKS_GIT_TOKEN_KEY
              value: {{ $gitSyncAuth.tokenKey | default "token" | quote }}
            {{- end }}
            {{- end }}
            - name: CUSTODY_GT_ROOT
              value: /data/gt
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.endpoints.otelExporterOtlpEndpoint }}
            - name: CUSTODY_DATA_BUCKET
              value: {{ .Values.s3.bucket }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources.api }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: analytics
              mountPath: {{ .Values.analytics.mountPath }}
            - name: gt-data
              mountPath: /data/gt
              readOnly: true
            {{- if $gitSyncEnabled }}
            - name: benchmarks-git
              mountPath: {{ $gitSync.mountPath | default "/benchmarks-git" }}
              readOnly: true
            {{- end }}
        {{- if $gitSyncEnabled }}
        - name: sync-benchmarks
          image: {{ $gitSync.image | default "registry.k8s.io/git-sync/git-sync:v4.4.0" | quote }}
          env:
            - name: GITSYNC_REPO
              value: {{ $gitSync.repo | quote }}
            - name: GITSYNC_REF
              value: {{ $gitSync.ref | default "main" | quote }}
            - name: GITSYNC_ROOT
              value: {{ $gitSync.mountPath | default "/benchmarks-git" | quote }}
            - name: GITSYNC_LINK
              value: {{ $gitSync.link | default "current" | quote }}
            - name: GITSYNC_PERIOD
              value: {{ $gitSync.period | default "30s" | quote }}
            - name: GITSYNC_DEPTH
              value: {{ $gitSync.depth | default 1 | quote }}
            {{- if $gitSyncAuthSecret }}
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $gitSyncAuthSecret | quote }}
                  key: {{ $gitSyncAuth.usernameKey | default "username" | quote }}
            - name: GITSYNC_PASSWORD_FILE
              value: /etc/git-secret/token
            {{- end }}
          volumeMounts:
            - name: benchmarks-git
              mountPath: {{ $gitSync.mountPath | default "/benchmarks-git" }}
            {{- if $gitSyncAuthSecret }}
            - name: benchmarks-git-credentials
              mountPath: /etc/git-secret
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: analytics
          persistentVolumeClaim:
            claimName: checkmaite-analytics
        - name: gt-data
          emptyDir: {}
        {{- if $gitSyncEnabled }}
        - name: benchmarks-git
          emptyDir: {}
        {{- end }}
        {{- if $gitSyncAuthSecret }}
        - name: benchmarks-git-credentials
          secret:
            secretName: {{ $gitSyncAuthSecret | quote }}
            items:
              - key: {{ $gitSyncAuth.tokenKey | default "token" | quote }}
                path: token
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "checkmaite.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkmaite.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "checkmaite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "checkmaite.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ required "images.ui.repository is required" .Values.images.ui.repository }}:{{ .Values.images.ui.tag }}"
          imagePullPolicy: {{ .Values.images.ui.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources.ui }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
