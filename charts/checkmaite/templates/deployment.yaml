apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "checkmaite.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkmaite.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "checkmaite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "checkmaite.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: checkmaite
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --address
            - "0.0.0.0"
            - --port
            - "{{ .Values.nebariapp.service.port | default 5006 }}"
            {{- if .Values.nebariapp.enabled }}
            - --allow-websocket-origin
            - {{ .Values.nebariapp.hostname }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.nebariapp.service.port | default 5006 }}
              protocol: TCP
          env:
            - name: LANGFUSE_HOST
              value: {{ .Values.langfuse.host }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretName }}
                  key: LANGFUSE_SECRET_KEY
            - name: JUDGE_BASE_URL
              value: {{ .Values.endpoints.judgeBaseUrl }}
            - name: SUT_BASE_URL
              value: {{ .Values.endpoints.sutBaseUrl }}
            - name: TOOLS_BASE_URL
              value: {{ .Values.endpoints.toolsBaseUrl }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.endpoints.otelExporterOtlpEndpoint }}
            - name: CHECKMAITE_ANALYTICS_PATH
              value: {{ .Values.analytics.mountPath }}
            - name: CUSTODY_DATA_BUCKET
              value: {{ .Values.s3.bucket }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.nebariapp.service.port | default 5006 }}
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: analytics
              mountPath: {{ .Values.analytics.mountPath }}
      volumes:
        - name: analytics
          persistentVolumeClaim:
            claimName: checkmaite-analytics
