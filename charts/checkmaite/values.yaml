# Default values for checkmaite
# This is a YAML-formatted file.

# =============================================================================
# Nebari Integration
# =============================================================================
# Creates a NebariApp CRD for the workflow-builder UI routing + Keycloak SSO.
# All hostname traffic routes to the ui Service (nginx), which serves the SPA
# and proxies /api/ to the api Service. Set enabled: true on a Nebari cluster.
nebariapp:
  enabled: false
  # hostname: checkmaite.mystic.openteams.ai  # Required when enabled
  service:
    name: checkmaite
    port: 3000
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    scopes:
      - openid
      - profile
      - email
  gateway: public
  # Cluster landing-page tile. icon must be anonymously fetchable — point it
  # at the custody-agent-served SVG, e.g.
  # https://agent.mystic.openteams.ai/mystic_depot_icon.svg
  landingPage:
    enabled: true
    displayName: "Checkmaite"
    description: "Custody evaluation — runs, metrics, analytics"
    icon: ""
    category: "Mystic"
    priority: 20

# =============================================================================
# Application images
# =============================================================================
# Repositories are required — must be injected per-deployment.
images:
  # Workflow-builder API (FastAPI, :8000)
  api:
    # repository: ghcr.io/openteams-ai/mystic/checkmaite-custody-api
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  # SPA bundle served by nginx (:3000); proxies /api/ to the api Service
  ui:
    # repository: ghcr.io/openteams-ai/mystic/checkmaite-custody-ui
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  # Full checkmaite+plugin image — only the nightly eval CronJob still uses it
  # (the api image deliberately omits the vendored checkmaite the CLI needs)
  checkmaite:
    # repository: ghcr.io/openteams-ai/mystic/checkmaite
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent

# =============================================================================
# Service Account (IRSA for S3 access to custody-demo-data)
# =============================================================================
serviceAccount:
  name: checkmaite
  # irsaRoleArn: arn:aws:iam::<account>:role/custody-demo-data-irsa
  irsaRoleArn: ""

# =============================================================================
# Analytics PVC (RWX via longhorn share-manager — contract §9: /data/analytics)
# =============================================================================
analytics:
  storageClassName: longhorn
  size: 50Gi
  mountPath: /data/analytics

# =============================================================================
# Langfuse credentials (secret reference — keys injected from K8s Secret)
# =============================================================================
langfuse:
  # K8s Secret in this namespace with LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY
  # (contract §9: Secret name "langfuse-keys")
  secretName: langfuse-keys
  # Cluster-provided Langfuse: the GitOps repo (openteams-ai/mystic.openteams.ai)
  # deploys nebari-langfuse-pack as release "langfuse" in namespace "langfuse".
  host: http://langfuse-web.langfuse.svc:3000

# =============================================================================
# Judge (hosted OpenRouter endpoint — contract §7)
# =============================================================================
judge:
  # K8s Secret in this namespace with key OPENROUTER_API_KEY
  secretName: judge-keys
  # Vision-capable model that supports response_format json_object
  model: google/gemini-3.5-flash

# =============================================================================
# Endpoint wiring (contract §9 / §7 / §10)
# =============================================================================
endpoints:
  sutBaseUrl: http://custody-agent.nebari-custody-demo-pack.svc:8080
  # Agent calls the fault proxy; plugin calls tools directly for evidence crops (§9)
  toolsBaseUrl: http://custody-fault-proxy.nebari-custody-demo-pack.svc:8085
  judgeBaseUrl: https://openrouter.ai/api/v1
  otelExporterOtlpEndpoint: http://otel-collector.opentelemetry.svc:4318

# =============================================================================
# S3
# =============================================================================
s3:
  bucket: custody-demo-data

# =============================================================================
# Nightly evaluation CronJob (disabled until Team 3's plugin is baked in)
# =============================================================================
nightlyEval:
  enabled: false
  schedule: "0 6 * * *"
  # Scenario(s) to run nightly — single value; use CLI --scenario for multi
  scenario: A-baseline
  modelId: claude-sonnet-4-6
  benchmarksRepo: https://github.com/openteams/custody-benchmarks.git

# =============================================================================
# Resources
# =============================================================================
# The api runs workflow executions in-process (polars metrics, judge calls,
# frame crops) — its memory limit keeps the old single-pod 8Gi ceiling so an
# eval can never be OOM-killed for having less headroom than before. The ui
# is nginx serving a static bundle; it idles around 10Mi.
resources:
  api:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 8Gi
  ui:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
