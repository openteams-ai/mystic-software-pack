# Default values for checkmaite
# This is a YAML-formatted file.

# =============================================================================
# Nebari Integration
# =============================================================================
# Creates a NebariApp CRD for the workflow-builder UI routing + Keycloak SSO.
# All hostname traffic routes to the ui Service (nginx), which serves the SPA
# and proxies /api/ to the api Service. Set enabled: true on a Nebari cluster.
nebariapp:
  enabled: false
  # hostname: checkmaite.mystic.openteams.ai  # Required when enabled
  service:
    name: checkmaite
    port: 3000
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    # Public PKCE client for the workflow-builder SPA (keycloak-js). The
    # operator provisions <namespace>-checkmaite-spa with redirect URIs
    # https://<hostname>/* and S256 enforced — same pattern as
    # custody-demo's custody-agent-spa. The confidential client above
    # stays gateway-only.
    spaClient:
      enabled: true
    scopes:
      - openid
      - profile
      - email
  # REQUIRED for any traffic to reach the app: the nebari-operator only
  # creates the HTTPRoute when spec.routing is present — without it the
  # NebariApp reports RoutingNotConfigured and the hostname 404s (same
  # lesson as custody-demo). Omitting routing.routes still means all
  # hostname traffic goes to the service above.
  routing:
    publicRoutes:
      # API health endpoint stays open for external monitors
      - pathPrefix: /api/v1/health
        pathType: Exact
      # The landing-page tile icon must be fetchable WITHOUT auth (the
      # cluster landing page renders it pre-login). The ui image ships it
      # in its public assets.
      - pathPrefix: /mystic_depot_icon.svg
        pathType: Exact
  gateway: public
  # Cluster landing-page tile. icon must be anonymously fetchable — point it
  # at the custody-agent-served SVG, e.g.
  # https://agent.mystic.openteams.ai/mystic_depot_icon.svg
  landingPage:
    enabled: true
    displayName: "Checkmaite"
    description: "Custody evaluation — runs, metrics, analytics"
    icon: ""
    category: "Mystic"
    priority: 20

# =============================================================================
# Application images
# =============================================================================
# Repositories are required — must be injected per-deployment.
images:
  # Workflow-builder API (FastAPI, :8000)
  api:
    # repository: ghcr.io/openteams-ai/mystic/checkmaite-custody-api
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  # SPA bundle served by nginx (:3000); proxies /api/ to the api Service
  ui:
    # repository: ghcr.io/openteams-ai/mystic/checkmaite-custody-ui
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  # NOTE: the standalone `checkmaite` image was retired — the api image now
  # bundles the checkmaite framework + eval CLI + baked benchmarks, and the
  # nightly CronJob runs from images.api.

# =============================================================================
# Service Account (IRSA for S3 access to custody-demo-data)
# =============================================================================
serviceAccount:
  name: checkmaite
  # irsaRoleArn: arn:aws:iam::<account>:role/custody-demo-data-irsa
  irsaRoleArn: ""

# =============================================================================
# Analytics PVC (RWX via longhorn share-manager — contract §9: /data/analytics)
# =============================================================================
analytics:
  storageClassName: longhorn
  size: 50Gi
  mountPath: /data/analytics

# =============================================================================
# Keycloak / OIDC runtime config (consumed by the workflow-builder api)
# =============================================================================
# The api serves /config.json to the SPA from CUSTODY_OIDC_* env vars (nginx
# proxies /config.json -> api /api/v1/config.json) and validates bearer
# tokens against the realm JWKS. The api deployment derives those env vars
# from this block when nebariapp auth is enabled — same pattern as
# custody-demo's agent (without it the SPA gets an empty config.json and
# keycloak-js redirect-loops on its own origin).
keycloak:
  # External URL — used by the browser (keycloak-js) and as the expected
  # token issuer (`iss` claim).
  url: https://keycloak.mystic.openteams.ai
  realm: nebari
  # In-cluster URL for JWKS fetches (no NLB hairpin), mirroring the
  # operator's SecurityPolicy convention.
  internalUrl: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080
  # SPA client id override; empty = the operator's default naming for
  # auth.spaClient, <namespace>-<nebariapp name>-spa.
  spaClientId: ""

# =============================================================================
# Langfuse credentials (secret reference — keys injected from K8s Secret)
# =============================================================================
langfuse:
  # K8s Secret in this namespace with LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY
  # (contract §9: Secret name "langfuse-keys")
  secretName: langfuse-keys
  # Cluster-provided Langfuse: the GitOps repo (openteams-ai/mystic.openteams.ai)
  # deploys nebari-langfuse-pack as release "langfuse" in namespace "langfuse".
  host: http://langfuse-web.langfuse.svc:3000

# =============================================================================
# Judge (hosted OpenRouter endpoint — contract §7)
# =============================================================================
judge:
  # K8s Secret in this namespace with key OPENROUTER_API_KEY
  secretName: judge-keys
  # Vision-capable model that supports response_format json_object
  model: google/gemini-3.5-flash

# =============================================================================
# Ask-Langfuse chat agent (read-only NL Q&A over Langfuse via its MCP server)
# =============================================================================
# The api serves a small tool-calling chat agent that connects to Langfuse's
# built-in MCP server at {langfuse.host}/api/public/mcp (Basic Auth from the
# langfuse.secretName keys) and answers questions over the evaluation data.
# It reuses OPENROUTER_API_KEY from judge.secretName for its model and is
# deliberately un-instrumented (never traces itself back into Langfuse).
chat:
  enabled: true
  # OpenAI-compatible model slug for the chat agent (must be a strong
  # tool-caller). Default goes through OpenRouter.
  model: anthropic/claude-sonnet-4.6
  # Optional override for the model endpoint (e.g. a self-hosted vLLM). When
  # empty the agent uses OpenRouter.
  baseUrl: ""

# =============================================================================
# Endpoint wiring (contract §9 / §7 / §10)
# =============================================================================
endpoints:
  sutBaseUrl: http://custody-agent.nebari-custody-demo-pack.svc:8080
  # Agent calls the fault proxy; plugin calls tools directly for evidence crops (§9)
  toolsBaseUrl: http://custody-fault-proxy.nebari-custody-demo-pack.svc:8085
  judgeBaseUrl: https://openrouter.ai/api/v1
  otelExporterOtlpEndpoint: http://opentelemetry-collector.monitoring.svc:4318

# =============================================================================
# S3
# =============================================================================
s3:
  bucket: custody-demo-data

# =============================================================================
# Nightly evaluation CronJob (disabled until Team 3's plugin is baked in)
# =============================================================================
nightlyEval:
  enabled: false
  schedule: "0 6 * * *"
  # Scenario(s) to run nightly — single value; use CLI --scenario for multi
  scenario: A-baseline
  # OpenRouter-routed model id (the deployment is OpenRouter-only).
  modelId: openrouter/anthropic/claude-sonnet-4.6
  # NOTE: no benchmarksRepo — scenarios/rubrics are baked into the api image
  # (used by the CronJob); GT still syncs from S3 in the fetch-gt init container.

# =============================================================================
# Resources
# =============================================================================
# The api runs workflow executions in-process (polars metrics, judge calls,
# frame crops) — its memory limit keeps the old single-pod 8Gi ceiling so an
# eval can never be OOM-killed for having less headroom than before. The ui
# is nginx serving a static bundle; it idles around 10Mi.
resources:
  api:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 8Gi
  ui:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
