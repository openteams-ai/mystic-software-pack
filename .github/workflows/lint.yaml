name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # ----------------------------------------------------------------
      # langfuse — dependency chart must be fetched before lint/template
      # ----------------------------------------------------------------
      - name: Update langfuse dependency
        run: helm dependency update charts/langfuse/

      # ----------------------------------------------------------------
      # custody-demo
      # ----------------------------------------------------------------
      - name: Lint custody-demo
        run: helm lint charts/custody-demo/

      - name: Template custody-demo (NebariApp disabled)
        run: helm template t charts/custody-demo/ --set nebariapp.enabled=false

      - name: Template custody-demo (NebariApp enabled)
        run: |
          helm template t charts/custody-demo/ \
            --set nebariapp.enabled=true \
            --set nebariapp.agent.hostname=agent.example.com \
            --set nebariapp.ui.hostname=demo.example.com

      # ----------------------------------------------------------------
      # checkmaite
      # ----------------------------------------------------------------
      - name: Lint checkmaite
        run: helm lint charts/checkmaite/

      - name: Template checkmaite (NebariApp disabled)
        run: |
          helm template t charts/checkmaite/ \
            --set image.repository=registry.example.com/checkmaite

      - name: Template checkmaite (NebariApp enabled + nightly CronJob)
        run: |
          helm template t charts/checkmaite/ \
            --set image.repository=registry.example.com/checkmaite \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=checkmaite.example.com \
            --set nightlyEval.enabled=true

      # ----------------------------------------------------------------
      # judge
      # ----------------------------------------------------------------
      - name: Lint judge
        run: helm lint charts/judge/

      - name: Template judge (NebariApp disabled — judge is always cluster-internal)
        run: helm template t charts/judge/ --set nebariapp.enabled=false

      # ----------------------------------------------------------------
      # langfuse
      # ----------------------------------------------------------------
      - name: Lint langfuse
        run: helm lint charts/langfuse/

      - name: Template langfuse (NebariApp disabled)
        run: |
          helm template t charts/langfuse/ \
            --set langfuse.postgresql.auth.password=ci \
            --set langfuse.clickhouse.auth.password=ci \
            --set langfuse.redis.auth.password=ci \
            --set langfuse.minio.auth.rootPassword=ci

      - name: Template langfuse (NebariApp enabled)
        run: |
          helm template t charts/langfuse/ \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=langfuse.example.com \
            --set langfuse.langfuse.nextauth.url=https://langfuse.example.com \
            --set langfuse.postgresql.auth.password=ci \
            --set langfuse.clickhouse.auth.password=ci \
            --set langfuse.redis.auth.password=ci \
            --set langfuse.minio.auth.rootPassword=ci
