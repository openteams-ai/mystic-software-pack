name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # ----------------------------------------------------------------
      # custody-demo
      # ----------------------------------------------------------------
      - name: Lint custody-demo
        run: helm lint charts/custody-demo/

      - name: Template custody-demo (NebariApp disabled)
        run: helm template t charts/custody-demo/ --set nebariapp.enabled=false

      - name: Template custody-demo (NebariApp enabled)
        run: |
          helm template t charts/custody-demo/ \
            --set nebariapp.enabled=true \
            --set nebariapp.agent.hostname=agent.example.com

      # ----------------------------------------------------------------
      # checkmaite
      # ----------------------------------------------------------------
      - name: Lint checkmaite
        run: helm lint charts/checkmaite/

      - name: Template checkmaite (NebariApp disabled)
        run: |
          helm template t charts/checkmaite/ \
            --set images.api.repository=registry.example.com/checkmaite-custody-api \
            --set images.ui.repository=registry.example.com/checkmaite-custody-ui

      - name: Template checkmaite (NebariApp enabled + nightly CronJob)
        run: |
          helm template t charts/checkmaite/ \
            --set images.api.repository=registry.example.com/checkmaite-custody-api \
            --set images.ui.repository=registry.example.com/checkmaite-custody-ui \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=checkmaite.example.com \
            --set nightlyEval.enabled=true

